name: TerapiaAcolher
options:
  bundleIdPrefix: com.ccypher
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
targets:
  TerapiaAcolher:
    type: application
    platform: iOS
    sources:
      - TerapiaAcolher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ccypher.terapiaacolher
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        INFOPLIST_FILE: TerapiaAcolher/Resources/Info.plist
  TerapiaAcolherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TerapiaAcolherUITests
    dependencies:
      - target: TerapiaAcolher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ccypher.terapiaacolher.uitests
        TEST_TARGET_NAME: TerapiaAcolher
        GENERATE_INFOPLIST_FILE: true
schemes:
  TerapiaAcolher:
    build:
      targets:
        TerapiaAcolher: all
        TerapiaAcolherUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TerapiaAcolherUITests
