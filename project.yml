name: TerapiaAcolher
options:
  bundleIdPrefix: com.ccypher
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: 4JAK4K7U7G
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    # HTTP para a rede local (backend do Mac) só em Debug (auditoria,
    # 2026-10-07): o Info.plist passa pelo pré-processador e a chave do ATS
    # fica dentro de `#if ACOLHER_DEBUG`.
    INFOPLIST_PREPROCESS: YES
  configs:
    Debug:
      INFOPLIST_PREPROCESSOR_DEFINITIONS: ACOLHER_DEBUG=1
targets:
  TerapiaAcolher:
    type: application
    platform: iOS
    sources:
      - TerapiaAcolher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ccypher.terapiaacolher
        MARKETING_VERSION: '1.2.0'
        CURRENT_PROJECT_VERSION: '13'
        INFOPLIST_FILE: TerapiaAcolher/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        # Assinatura MANUAL só para dispositivo. Isto vivia apenas no
        # .xcodeproj, que o xcodegen reescreve — então todo `xcodegen generate`
        # apagava a escolha e o Xcode a regravava depois, num vaivém que já
        # confundiu duas vezes. Simulador continua sem assinar.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
        DEVELOPMENT_TEAM[sdk=iphoneos*]: 4JAK4K7U7G
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Terapia Acolher App Store
      # Push por configuração: "development" aponta para o APNs sandbox e
      # "production" para o real. Um build de loja assinado com development
      # registra token no ambiente errado e nenhuma notificação chega — sem
      # erro visível em lugar nenhum.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TerapiaAcolher/Resources/TerapiaAcolher.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TerapiaAcolher/Resources/TerapiaAcolherRelease.entitlements
  TerapiaAcolherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TerapiaAcolherUITests
    dependencies:
      - target: TerapiaAcolher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ccypher.terapiaacolher.uitests
        TEST_TARGET_NAME: TerapiaAcolher
        GENERATE_INFOPLIST_FILE: true
schemes:
  TerapiaAcolher:
    build:
      targets:
        TerapiaAcolher: all
        TerapiaAcolherUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TerapiaAcolherUITests
          # Varredura visual (só tira screenshots, ~3 min) fica fora da suíte
          # padrão. Rodar sob demanda:
          #   xcodebuild test ... -only-testing:TerapiaAcolherUITests/DesignAuditUITests
          skippedTests:
            - DesignAuditUITests
            # Depende do backend LOCAL com chave de IA — não roda na suíte padrão.
            - AiFlowUITests
            # Compra de créditos contra o backend LOCAL + leads local + Asaas sandbox.
            - LeadsCheckoutUITests
            # Resumo e PDF das transcrições contra o backend LOCAL (porta 3010).
            - TranscriptPDFUITests
            # Depende do backend LOCAL do Gateway (porta 3010) e de fotos na
            # galeria do simulador (xcrun simctl addmedia) — rodar sob demanda,
            # comentando esta linha e rodando `xcodegen generate` antes.
            - GatewayFlowUITests
            # Depende do backend LOCAL (porta 3000) e de um admin respondendo
            # em paralelo pela API — rodar sob demanda, como o de cima.
            - SupportFlowUITests
