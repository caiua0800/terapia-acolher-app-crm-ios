name: TerapiaAcolher
options:
  bundleIdPrefix: com.ccypher
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
targets:
  TerapiaAcolher:
    type: application
    platform: iOS
    sources:
      - TerapiaAcolher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ccypher.terapiaacolher
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        INFOPLIST_FILE: TerapiaAcolher/Resources/Info.plist
